name: Create release

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Read version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check whether this version is already published
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ env.version }}" > /dev/null; then
            echo "Version ${{ env.version }} is already tagged."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.get-version.outputs.version }}
          tag_name: v${{ steps.get-version.outputs.version }}
          body: Release for version ${{ steps.get-version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}

      - name: Create Git tag
        run: |
          git tag v${{ steps.get-version.outputs.version }}
          git push origin v${{ steps.get-version.outputs.version }}

  upload-assets:
    name: Upload assets
    needs: create-release
    if: ${{ needs.create-release.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm --color ci

      - name: Package artifact
        run: npm --color run package

      - name: Verify code signing (macOS)
        run: |
          codesign --verify --deep --strict --verbose=1  "dist/Clippy-darwin-arm64/Clippy.app"
          codesign --display --verbose=1 "dist/Clippy-darwin-arm64/Clippy.app"
        if: runner.os == 'macOS'

      - name: Compress artifact (Windows)
        shell: pwsh
        run: Compress-Archive -Path 'dist/*' -DestinationPath "Clippy-${{ runner.os }}.zip"
        if: runner.os == 'Windows'

      - name: Compress artifact (macOS)
        shell: bash
        run: ditto -c -k --sequesterRsrc dist "Clippy-${{ runner.os }}.zip"
        if: runner.os == 'macOS'

      - name: Compress artifact (Linux)
        shell: bash
        working-directory: dist
        run: zip -ry "../Clippy-${{ runner.os }}.zip" *
        if: runner.os == 'Linux'

      - name: Generate hash file (Windows)
        shell: pwsh
        run: |
          $zip = "Clippy-${{ runner.os }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  $zip" | Set-Content -Encoding ascii "$zip.sha256"
        if: runner.os == 'Windows'

      - name: Generate hash file (macOS and Linux)
        shell: bash
        run: shasum -a 256 "Clippy-${{ runner.os }}.zip" > "Clippy-${{ runner.os }}.zip.sha256"
        if: runner.os != 'Windows'

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload
          "v${{ needs.create-release.outputs.version }}"
          "Clippy-${{ runner.os }}.zip"
          "Clippy-${{ runner.os }}.zip.sha256"
