name: Create release

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Ensure that only one release creation workflow runs at a time, queuing subsequent runs.
concurrency:
  group: create-release
  queue: max

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Read version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check whether this version is already published
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.get-version.outputs.version }}" > /dev/null; then
            echo "Version v${{ steps.get-version.outputs.version }} is already tagged."
            exit 1
          fi

  build:
    name: Build assets
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm --color ci

      - name: Package artifact
        run: npm --color run package

      - name: Verify code signing (macOS)
        run: |
          codesign --verify --deep --strict --verbose=1  "dist/Clippy-darwin-arm64/Clippy.app"
          codesign --display --verbose=1 "dist/Clippy-darwin-arm64/Clippy.app"
        if: runner.os == 'macOS'

      - name: Compress artifact (Windows)
        shell: pwsh
        run: Compress-Archive -Path 'dist/*' -DestinationPath "Clippy-${{ runner.os }}.zip"
        if: runner.os == 'Windows'

      - name: Compress artifact (macOS)
        shell: bash
        run: ditto -c -k --sequesterRsrc dist "Clippy-${{ runner.os }}.zip"
        if: runner.os == 'macOS'

      - name: Compress artifact (Linux)
        shell: bash
        working-directory: dist
        run: zip -ry "../Clippy-${{ runner.os }}.zip" *
        if: runner.os == 'Linux'

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: Clippy-${{ runner.os }}.zip
          archive: false
          if-no-files-found: error

  create-release:
    name: Create release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Clippy-*.zip
          path: assets
          merge-multiple: true
          skip-decompress: true

      - name: Generate checksums
        working-directory: assets
        run: sha256sum Clippy-Linux.zip Clippy-macOS.zip Clippy-Windows.zip > SHA256SUMS

      - name: Generate release notes
        run: |
          {
            echo "Release for version ${{ needs.prepare.outputs.version }}"
            echo
            echo '## SHA-256 checksums'
            echo
            echo '```text'
            cat assets/SHA256SUMS
            echo '```'
          } > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.prepare.outputs.version }}
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            assets/Clippy-Linux.zip
            assets/Clippy-macOS.zip
            assets/Clippy-Windows.zip
            assets/SHA256SUMS
